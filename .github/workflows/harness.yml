# The environment-bound checks, which are not the gate.
#
# One job per requirement, named for what the runner has to supply, so a reader
# of this list can tell which runs would go red because the internet was down
# without opening a file. internal/harness holds the requirements and the suite
# refuses a requirement with no job here and a job here with no requirement.
#
# Nothing here blocks a merge. decisions/headless-and-unelevated.md says the gate
# never depends on this file, and the gate's own report says on every run that
# none of these ran, so a green gate is not read as a green harness.
#
# One job elevates and the rest do not. needs-browser runs a single privileged
# command, with the reason beside it in that job, because Chrome will not start
# on this image otherwise. The unelevated rule that file states is about the
# gate, and no leg of the gate reaches anything here.
name: Harness

on:
  # Deliberate and nothing else. A schedule is excluded as well as push and
  # pull_request: a run nobody asked for produces a red nobody is holding, and
  # the suite refuses any trigger but this one.
  workflow_dispatch:
    inputs:
      requirement:
        description: "which requirement to ask for"
        required: true
        type: choice
        options:
          - needs-network
          - needs-browser
          - needs-jellyfin

# Read-only: no job here writes to the repository.
permissions:
  contents: read

jobs:
  needs-network:
    name: needs-network
    if: inputs.requirement == 'needs-network'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the authority for the version floor, so it is read rather
          # than restated here where it would drift.
          go-version-file: go.mod
      - env:
          # The read is against the world, so it meets the rate limit without a
          # token. The token is the run's own, scoped by the permissions above.
          GITHUB_TOKEN: ${{ github.token }}
          # Where the manifest is published. It is a repository variable rather
          # than a literal here because decisions/manifest-address.md allows an
          # install address into a tracked file only once the address answers
          # with the file it promises, and today it answers 404. Unset is a
          # refusal in the check rather than a skip.
          MANIFEST_ADDRESS: ${{ vars.MANIFEST_ADDRESS }}
        run: go run . harness needs-network

  needs-browser:
    name: needs-browser
    if: inputs.requirement == 'needs-browser'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Chrome puts every renderer in a namespace sandbox, and building that
      # sandbox needs an unprivileged user namespace. The runner image restricts
      # those with AppArmor, so the browser does not start without isolation, it
      # refuses to start at all:
      #
      #   FATAL:content/browser/zygote_host/zygote_host_impl_linux.cc:128]
      #   No usable sandbox!
      #
      # The line below lifts that one restriction, on this runner, for the length
      # of this job, on a machine that is destroyed when the job ends. The
      # browser keeps its own sandbox. The alternative is a flag that turns that
      # sandbox off instead, which would follow the check onto every machine it
      # ever ran on, a contributor's workstation included, so the weakening is
      # scoped to a throwaway runner rather than travelling with the test.
      #
      # It is the only privileged command in this file and it stays inside this
      # job. A second job needing a browser gets the same step and the same
      # reason rather than the setting moving somewhere it applies to everything.
      #
      # It goes when the image stops needing it, and that is read rather than
      # guessed: the step prints the setting before it changes it, and the day
      # that line already reads 0 is the day the step is deleted.
      #
      # `sudo -n` never prompts. It fails rather than asking, which is the same
      # reason gate.yml gives for asking about elevation in a job at all.
      - name: Allow the unprivileged user namespace Chrome's sandbox is built from
        run: |
          sysctl -n kernel.apparmor_restrict_unprivileged_userns
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: go run . harness needs-browser

  needs-jellyfin:
    name: needs-jellyfin
    if: inputs.requirement == 'needs-jellyfin'
    runs-on: ubuntu-latest
    # Longer than the jobs above because this one waits on a server rather than
    # on a request: the check's own windows for the server answering, the
    # catalogue filling in and an install finishing add up to more than fifteen
    # minutes before the image is even pulled.
    timeout-minutes: 30
    env:
      # Where the server below listens. The check refuses when this is unset
      # instead of skipping, because a check that skips over a missing
      # environment reports green over nothing. It is a literal rather than a
      # repository variable because this job is what puts the server there, so
      # the two would be the same fact written twice.
      JELLYFIN_ADDRESS: http://127.0.0.1:8096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The server the requirement is named for. It is brought up here rather
      # than inside the check for two reasons: a contributor on a laptop cannot
      # have a test start one for them and needs to provide one the same way
      # this job does, and the half of the check that plants a mismatched
      # checksum serves its own catalogue on a port this machine chooses, which
      # the server can only reach if it shares this network namespace.
      #
      # Pinned by digest beside its version, the way every action in this file
      # is pinned by commit beside its tag, so a run a year from now is the run
      # that was reviewed. The server is unprivileged and is destroyed with the
      # runner; nothing here asks for rights on anybody's machine.
      - name: Bring a Jellyfin server up for this run
        run: |
          docker run --detach --name jellyfin-under-test --network host jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
      - run: go run . harness needs-jellyfin
      # What the server said, on the path where the check could not tell whether
      # the failure was the plugin or the server. The requirement's own cost
      # line says that is a failure this run can have, so the log that separates
      # the two is fetched rather than left on a machine that is about to go.
      - name: What the server logged
        if: failure()
        run: docker logs jellyfin-under-test
      - name: Tear the server down
        if: always()
        run: docker rm --force jellyfin-under-test

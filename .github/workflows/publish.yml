# The publication run: build the catalogue from the declared sources and place
# it at the file the install address answers with.
#
# Plugins release when they release, so the catalogue has to catch up without
# anybody remembering to start it, and the run somebody wants most is the one
# right after a release. The two triggers below are that pair and nothing else.
#
# What a run here does not do is put the file in front of an operator. The site
# is served from the docs directory of the default branch, and
# decisions/release-procedure.md keeps a pull request and a merge in the way of
# that directory on purpose. So the branch, the gate and the merge are the same
# route as every other change, and this workflow is the part in front of them.
#
# THE RUN NOW PROPOSES WHAT IT BUILT, AND THIS COMMENT SAID IT DID NOT. What
# stood here said the verdict the run printed was the thing to read, and left
# opening the pull request to whoever read it. Nothing read it: the run was green
# on every dispatch while the freshness watch reddened twice on the exact version
# the run had just built and discarded. So the carrying word is on the step
# below, and a run that finds the served branch behind what the declarations come
# to opens or updates one pull request against it. internal/carry is where every
# part of that is decided and judged against a fixture.
#
# The merge is untouched, and that is the half to read carefully. This run
# proposes and merges nothing, the ruleset in front of the default branch is
# exactly as strict as it was, and the same gate stands in front of the request
# this run opens as in front of any other.
#
# The trap that costs the most to find later: a request opened with a run's own
# token creates no workflow run, so the checks on it do not start by themselves
# and it sits carrying no verdict rather than a red one. Closing and reopening
# the request starts them. The request says so in its own body, which is where
# whoever merges it will be reading.
#
# Hardened the way every other workflow here is: actions pinned by commit with
# the version beside them, checkout without persisted credentials, nothing
# granted at the workflow level, and the two write scopes on the one job that
# needs them. The checkout still persists no credentials, because no step here
# uses git to push: the branch, the commit and the request are all made through
# the API, which also means the commit that lands is signed - and the ruleset in
# front of the default branch requires a verified signature with no bypass, so a
# commit made any other way from a runner could never be merged.
name: Publish

on:
  # Daily, and ahead of the sweep in this tree, so a run that died is reported
  # by that morning's sweep rather than a day later.
  schedule:
    - cron: "23 5 * * *"
  # And on request, which is the run wanted the moment a plugin releases.
  workflow_dispatch:

# Nothing at the workflow level. The job below grants the two scopes it needs and
# nothing else.
permissions: {}

# Runs over one destination are serialised, and the run holding the write is
# never the one cancelled. That is the opposite of the setting in gate.yml next
# door, where a superseded run is cancelled because every leg there is a read.
#
# The group names the destination rather than the workflow or the ref. A group
# carrying either of those would put a scheduled run and a hand-started one in
# different queues and let them write the same file at once, which is the
# failure this whole block exists against. internal/publish.Target.Group is
# where the name comes from, and the suite refuses this file declaring another.
#
# The trap that is cheaper to read here than to find later: a group holds one
# running and one queued run. Asking for a run by hand while a scheduled one is
# already queued evicts the queued one. That is acceptable, because the run that
# survives reads the same sources and produces the same catalogue, and it is
# written down here so that a publication that never happened is not a mystery.
concurrency:
  group: publish-docs/manifest.json
  cancel-in-progress: false

jobs:
  publish:
    name: "Publish: catalogue"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The standing branch and the commit on it, both made through the API.
      contents: write
      # The one request the run opens, and the read that finds the one already
      # open so a second is not opened beside it.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the token in .git/config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the authority for the version floor, so it is read rather
          # than restated here where it would drift.
          go-version-file: go.mod
      - name: Build the catalogue, place it, and propose it
        run: go run . publish carry
        env:
          # The run's own token, carrying the two scopes granted on this job. It
          # is what reads the declared sources, and what opens the request.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
